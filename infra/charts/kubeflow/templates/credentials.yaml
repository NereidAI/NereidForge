{{/*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Render the chart-wide credential contract before any install hook can run.
Consumers use secretKeyRef so unrelated Jobs receive no credentials and
Kubernetes does not expand $(...) sequences inside operator-supplied values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-kubeflow-credentials"
type: Opaque
stringData:
  DEX_STATIC_PASSWORD_HASH: {{ required "global.dex.staticPasswordHash is required" .Values.global.dex.staticPasswordHash | quote }}
  SEAWEEDFS_S3_ACCESS_KEY: {{ required "global.seaweedfs.s3AccessKey is required for KFP" .Values.global.seaweedfs.s3AccessKey | quote }}
  SEAWEEDFS_S3_SECRET_KEY: {{ required "global.seaweedfs.s3SecretKey is required for KFP" .Values.global.seaweedfs.s3SecretKey | quote }}
