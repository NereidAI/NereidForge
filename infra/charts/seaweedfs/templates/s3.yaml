apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seaweedfs.fullname" . }}-s3-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
    component: s3
data:
  s3-config.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "{{ .Values.s3.accessKey }}",
              "secretKey": "{{ .Values.s3.secretKey }}"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "List",
            "Tagging",
            "Write"
          ]
        },
        {
          "name": "anonymous",
          "credentials": [],
          "actions": {{ .Values.s3.anonymousReadPrefixes | default list | toJson }}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seaweedfs.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
    component: s3
spec:
  replicas: {{ .Values.s3.replicaCount }}
  selector:
    matchLabels:
      {{- include "seaweedfs.selectorLabels" . | nindent 6 }}
      component: s3
  template:
    metadata:
      labels:
        {{- include "seaweedfs.selectorLabels" . | nindent 8 }}
        component: s3
    spec:
      containers:
        - name: s3
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "s3"
            - '-filer={{ include "seaweedfs.fullname" . }}-filer:8888'
            - "-port=8333"
            - "-config=/etc/seaweedfs/s3-config.json"
          ports:
            - name: s3
              containerPort: 8333
          resources:
            {{- toYaml .Values.s3.resources | nindent 12 }}
          volumeMounts:
            - name: s3-config
              mountPath: /etc/seaweedfs
      volumes:
        - name: s3-config
          configMap:
            name: {{ include "seaweedfs.fullname" . }}-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seaweedfs.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8333
      name: s3
      targetPort: 8333
    - port: 9000
      name: s3-compat
      targetPort: 8333
  selector:
    app.kubernetes.io/name: {{ include "seaweedfs.name" . }}
    component: s3
