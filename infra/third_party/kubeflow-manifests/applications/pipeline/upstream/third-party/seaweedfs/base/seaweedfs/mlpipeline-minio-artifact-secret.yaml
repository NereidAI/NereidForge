kind: Secret
apiVersion: v1
metadata:
  # KFP apiserver / UI / profile-controller read these keys to talk to S3.
  # Installers inject the operator-managed SeaweedFS credentials.
  name: mlpipeline-minio-artifact
stringData:
  accesskey: "${SEAWEEDFS_S3_ACCESS_KEY}"
  secretkey: "${SEAWEEDFS_S3_SECRET_KEY}"
