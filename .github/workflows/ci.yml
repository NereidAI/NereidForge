# Optional manual cache-warming mirror of publish-images.yml (root treaty §19.1).
#
# These builds are expensive and are not CI acceptance gates. Never trigger this
# workflow from a push, pull request, or schedule. An operator may run it
# deliberately before a release; ordinary validation stays in the lightweight
# DCO and license-compliance workflows, while publish-dev.yml and
# publish-images.yml perform the actual artifact builds.
#
# Every docker/build-push-action invocation of the tag workflow is reproduced
# here with push: false and no registry login, so a manual run can warm the
# shared GitHub Actions buildx cache (type=gha). Keep the build matrix below —
# contexts, files, platforms, build arguments — in sync with publish-images.yml.
# Publication-only mechanics deliberately remain in publish-images.yml.
#
# A manual run classifies HEAD against its parent and builds only scopes whose
# real image inputs changed. Documentation-only changes complete without an
# image build. Any unrecognized path fails safe and selects every scope. Vendor
# jobs skip when their specialized wheel-index variables are not configured.
name: cache-warm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_CPU_INDEX: ${{ vars.TORCH_CPU_INDEX }}
  TORCH_XPU_INDEX: ${{ vars.TORCH_XPU_INDEX }}
  TORCH_ROCM_INDEX: ${{ vars.TORCH_ROCM_INDEX }}
  PADDLE_GPU_INDEX: ${{ vars.PADDLE_GPU_INDEX }}
  HF_ENDPOINT: ${{ vars.HF_ENDPOINT }}

jobs:
  # path-scope classifies the changed files with plain git and emits one
  # boolean output per cache-warm job. Patterns mirror the Dockerfile COPY
  # inputs, not directory conventions: the backend image copies python-backend,
  # kfp-pipelines, two trainer profiles, infra/configs and root license files,
  # while the frontend image takes everything under frontend except the
  # help corpus, which is documentation shipped as static assets but excluded
  # from cache-warm triggers to keep documentation-only manual runs cheap.
  path-scope:
    name: Determine changed-path build scope
    runs-on: ubuntu-latest
    outputs:
      applications: ${{ steps.scope.outputs.applications }}
      core: ${{ steps.scope.outputs.core }}
      vendor: ${{ steps.scope.outputs.vendor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          # workflow_dispatch supplies no push base; compare the selected HEAD
          # with its first parent for this optional, on-demand warm run.
          base="HEAD~1"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          echo "Changed ${#changed[@]} path(s) against $base:"
          printf '  %s\n' "${changed[@]}"
          apps=false; core=false; vendor=false; broad=false; docs=0
          for f in "${changed[@]}"; do
            case "$f" in
              # Build system, image references and root legal files can affect
              # every image: run the full matrix.
              .github/workflows/*|infra/scripts/*|images-manifest.txt|Makefile|\
              LICENSE|NOTICE|THIRD_PARTY_NOTICES.md)
                broad=true ;;
              python-backend/*|infra/configs/*)
                apps=true ;;
              kfp-pipelines/*)
                apps=true; core=true ;;
              builders/*)
                # Backend image copies two trainer profiles from this tree.
                apps=true; core=true; vendor=true ;;
              frontend/*)
                # The help corpus is bilingual documentation only; everything
                # else under frontend is a real frontend image input.
                case "$f" in frontend/public/help/*) docs=$((docs + 1)) ;; *) apps=true ;; esac ;;
              docs/*|*.md)
                docs=$((docs + 1)) ;;
              # Unknown paths fail safe: warm every scope rather than skip a
              # build whose inputs were not catalogued here.
              *)
                echo "Uncatalogued path '$f': failing safe to full scope"
                broad=true ;;
            esac
          done
          if "$broad"; then apps=true; core=true; vendor=true; fi
          {
            echo "applications=$apps"
            echo "core=$core"
            echo "vendor=$vendor"
          } >> "$GITHUB_OUTPUT"
          echo "Scope decision -> applications=$apps core=$core vendor=$vendor (documentation-only files: $docs)"

  applications:
    name: backend/frontend multi-arch cache warm
    needs: path-scope
    if: needs.path-scope.outputs.applications == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Two explicit steps instead of a matrix: the per-component build args
      # are baked at the fixed rolling dev version below.
      - name: Warm backend multi-architecture image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.0.0-dev
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nereidforge-backend
          cache-to: type=gha,mode=max,scope=nereidforge-backend
      - name: Warm frontend multi-architecture image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_APP_VERSION=0.0.0-dev
            VITE_IMAGE_TAG=0.0.0-dev
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nereidforge-frontend
          cache-to: type=gha,mode=max,scope=nereidforge-frontend

  core:
    name: core runtime, converters, optimizer, and evaluator cache warm
    needs: path-scope
    if: needs.path-scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - name: Warm runtime base
        id: runtime-base
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          # Export the exact new multi-arch index locally. Dependent builds
          # consume its digest through an OCI named context, never an old GHCR tag.
          outputs: type=oci,dest=/tmp/nf-runtime.tar
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nf-runtime
          cache-to: type=gha,mode=max,scope=nf-runtime
      - name: Unpack runtime base OCI layout
        run: |
          test -n "${{ steps.runtime-base.outputs.digest }}"
          mkdir -p /tmp/nf-runtime
          tar -xf /tmp/nf-runtime.tar -C /tmp/nf-runtime
          test -f /tmp/nf-runtime/index.json
      - name: Warm CPU torch trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-torch/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-torch-cpu
          cache-to: type=gha,mode=max,scope=trainer-torch-cpu
      - name: Warm CPU paddle trainer (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-paddle/Dockerfile
          # paddlepaddle 3.0.0 publishes no arm64 PyPI wheel; arm64 builds fail
          # at metadata generation, so this image is intentionally amd64-only.
          platforms: linux/amd64
          build-args: |
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-paddle-cpu
          cache-to: type=gha,mode=max,scope=trainer-paddle-cpu
      - name: Warm torch converter
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_BASE_IMAGE=python:3.14-slim
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-convert
          cache-to: type=gha,mode=max,scope=trainer-convert
      - name: Warm TensorFlow converter
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert-tf
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-convert-tf
          cache-to: type=gha,mode=max,scope=trainer-convert-tf
      - name: Warm Paddle converter (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert-pp
          # Pins paddlepaddle==3.0.0, which has no arm64 PyPI wheel; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-convert-pp
          cache-to: type=gha,mode=max,scope=trainer-convert-pp
      - name: Warm optimizer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/optimizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.0.0-dev
            RUNTIME_IMAGE=ghcr.io/nereidai/nf-runtime:0.0.0-dev
          build-contexts: |
            ghcr.io/nereidai/nf-runtime:0.0.0-dev=oci-layout:///tmp/nf-runtime@${{ steps.runtime-base.outputs.digest }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=train-optimizer
          cache-to: type=gha,mode=max,scope=train-optimizer
      - name: Warm evaluator
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/evaluator/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.0.0-dev
            RUNTIME_IMAGE=ghcr.io/nereidai/nf-runtime:0.0.0-dev
          build-contexts: |
            ghcr.io/nereidai/nf-runtime:0.0.0-dev=oci-layout:///tmp/nf-runtime@${{ steps.runtime-base.outputs.digest }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=train-evaluator
          cache-to: type=gha,mode=max,scope=train-evaluator
      - name: Warm Intel GPU OVMS (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/inference-model-server-openvino-xpu
          file: builders/inference-model-server-openvino-xpu/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=openvino/model_server:2025.1
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=inference-model-server-openvino-xpu
          cache-to: type=gha,mode=max,scope=inference-model-server-openvino-xpu
      - name: Warm ml-backend (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/ml-backend
          file: builders/ml-backend/Dockerfile
          # Installs paddlepaddle/paddleocr, unavailable as arm64 PyPI wheels; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ml-backend
          cache-to: type=gha,mode=max,scope=ml-backend
      - name: Warm ml-backend-custom (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/ml-backend-custom
          file: builders/ml-backend-custom/Dockerfile
          # Installs paddlepaddle/paddleocr, unavailable as arm64 PyPI wheels; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ml-backend-custom
          cache-to: type=gha,mode=max,scope=ml-backend-custom
      - name: Warm notebook workbench (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/notebook-base
          file: builders/notebook-base/Dockerfile
          # Installs paddlepaddle, unavailable as an arm64 PyPI wheel; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            JUPYTER_BASE_IMAGE=quay.io/jupyter/base-notebook:python-3.12.9
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=prediction-jupyter-base
          cache-to: type=gha,mode=max,scope=prediction-jupyter-base

  vendor-xpu:
    name: vendor trainers - Intel XPU cache warm (single-arch, treaty §19.2.1)
    needs: path-scope
    # Skip contexts without the specialized wheel index and changes outside
    # the trainer builder tree; the tag workflow hard-fails instead.
    if: >-
      ${{ needs.path-scope.outputs.vendor == 'true' &&
           vars.TORCH_XPU_INDEX != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - name: Warm XPU vendor base
        id: xpu-base
        uses: docker/build-push-action@v6
        with:
          context: builders/trainer-xpu
          file: builders/trainer-xpu/Dockerfile
          platforms: linux/amd64
          # PYPI_INDEX and the generic mirror args keep their empty Dockerfile
          # defaults on hosted runners (treaty §17); only the specialized XPU
          # wheel index is injected from Actions variables.
          build-args: |
            TORCH_XPU_INDEX=${{ env.TORCH_XPU_INDEX }}
          # Keep the just-built AMD64 base local for all three dependent builds.
          outputs: type=oci,dest=/tmp/trainer-xpu-base.tar
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-xpu-base
          cache-to: type=gha,mode=max,scope=trainer-xpu-base
      - name: Unpack XPU base OCI layout
        run: |
          test -n "${{ steps.xpu-base.outputs.digest }}"
          mkdir -p /tmp/trainer-xpu-base
          tar -xf /tmp/trainer-xpu-base.tar -C /tmp/trainer-xpu-base
          test -f /tmp/trainer-xpu-base/index.json
      - name: Warm XPU packaging evaluator
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/evaluator-xpu/Dockerfile
          platforms: linux/amd64
          build-args: |
            XPU_BASE_IMAGE=ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev
          build-contexts: |
            ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev=oci-layout:///tmp/trainer-xpu-base@${{ steps.xpu-base.outputs.digest }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=train-evaluator-xpu
          cache-to: type=gha,mode=max,scope=train-evaluator-xpu
      - name: Warm XPU torch trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-torch/Dockerfile.xpu
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev
            TORCH_XPU_INDEX=${{ env.TORCH_XPU_INDEX }}
          build-contexts: |
            ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev=oci-layout:///tmp/trainer-xpu-base@${{ steps.xpu-base.outputs.digest }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-torch-xpu
          cache-to: type=gha,mode=max,scope=trainer-torch-xpu
      - name: Warm XPU LLM trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-llm-xpu/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev
            HF_ENDPOINT=${{ env.HF_ENDPOINT }}
          build-contexts: |
            ghcr.io/nereidai/trainer-xpu-base:0.0.0-dev=oci-layout:///tmp/trainer-xpu-base@${{ steps.xpu-base.outputs.digest }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-llm-xpu
          cache-to: type=gha,mode=max,scope=trainer-llm-xpu

  vendor-cu:
    name: vendor trainers - NVIDIA CUDA cache warm (single-arch, treaty §19.2.1)
    needs: path-scope
    # Skip contexts without the Paddle GPU wheel index and changes outside
    # the trainer builder tree.
    if: >-
      ${{ needs.path-scope.outputs.vendor == 'true' &&
           vars.PADDLE_GPU_INDEX != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - name: Warm CUDA torch trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-torch/Dockerfile.cu
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-torch-cu
          cache-to: type=gha,mode=max,scope=trainer-torch-cu
      - name: Warm CUDA paddle trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-paddle/Dockerfile.cu
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
            PADDLE_GPU_INDEX=${{ env.PADDLE_GPU_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-paddle-cu
          cache-to: type=gha,mode=max,scope=trainer-paddle-cu
      - name: Warm CUDA LLM trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-llm-cu/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-llm-cu
          cache-to: type=gha,mode=max,scope=trainer-llm-cu

  vendor-rocm:
    name: vendor trainers - AMD ROCm cache warm (single-arch, treaty §19.2.1)
    needs: path-scope
    # Skip contexts without the ROCm wheel index and changes outside the
    # trainer builder tree.
    if: >-
      ${{ needs.path-scope.outputs.vendor == 'true' &&
           vars.TORCH_ROCM_INDEX != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      # Cost note: this pulls the roughly 30 GB ROCm base
      # (rocm/pytorch:rocm6.3_ubuntu24.04_...) on every warmed commit, mirroring
      # the tag workflow. Revisit the trigger matrix if this proves too costly.
      - name: Warm ROCm torch trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-torch/Dockerfile.rocm
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=rocm/pytorch:rocm6.3_ubuntu24.04_py3.12_pytorch_release_2.4.0
            TORCH_ROCM_INDEX=${{ env.TORCH_ROCM_INDEX }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-torch-rocm
          cache-to: type=gha,mode=max,scope=trainer-torch-rocm
      - name: Warm ROCm LLM trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-llm-rocm/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=rocm/pytorch:rocm6.3_ubuntu24.04_py3.12_pytorch_release_2.4.0
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=trainer-llm-rocm
          cache-to: type=gha,mode=max,scope=trainer-llm-rocm
