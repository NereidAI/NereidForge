name: builders-verify

on:
  pull_request:
    paths:
      - "builders/**"
      - "kfp-pipelines/docker/**"
      - "optimizer-plugins/**"
      - ".github/workflows/builders-verify.yml"
      # Keep the inventory checks coupled to the existing build definitions.
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-dev.yml"
      - ".github/workflows/publish-images.yml"
      - "Makefile"
      - "scripts/02_build-images.sh"
      - "scripts/build-vendor-trainer.sh"
      - "scripts/prepare-rocm-buildkit-storage.sh"
      - "scripts/stamp-dev-image.sh"

permissions:
  contents: read

concurrency:
  group: builders-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Builder offline tests and mandatory scratch Buildx context check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the existing builder test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            pytest PyYAML "boto3>=1.34" "numpy<2.4" onnx onnxruntime \
            opencv-python-headless -r builders/ml-backend/requirements-base.txt
          python3 -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch

      - name: Set up Buildx for the required clean-checkout check
        uses: docker/setup-buildx-action@v4

      # This target fails rather than skips when Docker or Buildx is unavailable.
      # It builds only FROM scratch plus COPY instructions, with no push/login.
      - name: Verify PR #34 XPU COPY context
        run: make -C builders verify-buildx

      - name: Run builder-owned offline verification
        run: make -C builders verify
