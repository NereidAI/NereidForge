# Rolling dev channel (root treaty §19.5). Every push to main publishes the
# two suite application images (backend, frontend) to GHCR with exactly two
# tags sharing one index digest: the immutable 0.0.0-dev-<short-sha> for
# traceability/rollback, listed first, and the floating 0.0.0-dev moved to the
# new HEAD, listed last so GHCR displays it as the primary tag. Pull requests
# deliberately do not trigger this workflow, so forks cannot publish into the
# organization namespace. Vendor/trainer/runtime/base images stay
# release-only in publish-images.yml; the local Makefile remains build-only.
#
# Path scoping: a plain-git path-scope job gates each publication on the real
# inputs of its image. Unlike the optional manual cache-warm filter,
# frontend/public/help/ is NOT excluded here: the help corpus ships inside
# the frontend image, so a docs-only merge must still publish a fresh frontend dev image while the
# unchanged backend image is skipped. Pure documentation paths outside image
# contexts (docs/, root markdown) publish nothing.
name: publish-dev

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Never cancel a dev publication: a cancelled run could leave the floating
# 0.0.0-dev tag pointing at a superseded commit.
concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # path-scope mirrors the manual cache-warm classifier with publication
  # semantics: the frontend image bundles the help corpus, so frontend
  # changes always publish the frontend, while backend scoping follows its COPY inputs.
  path-scope:
    name: Determine changed-path publication scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          # publish-dev only fires on main pushes; github.event.before is the
          # previous main tip (zero sha on the rare first-push case).
          base="${{ github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          echo "Changed ${#changed[@]} path(s) against $base:"
          printf '  %s\n' "${changed[@]}"
          backend=false; frontend=false; broad=false; docs=0
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/*|infra/scripts/*|images-manifest.txt|Makefile|\
              LICENSE|NOTICE|THIRD_PARTY_NOTICES.md)
                broad=true ;;
              python-backend/*|kfp-pipelines/*|builders/*|infra/configs/*)
                backend=true ;;
              frontend/*)
                frontend=true ;;
              docs/*|*.md)
                docs=$((docs + 1)) ;;
              # Unknown paths fail safe and publish both images.
              *)
                echo "Uncatalogued path '$f': failing safe to full scope"
                broad=true ;;
            esac
          done
          if "$broad"; then backend=true; frontend=true; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"
          echo "Scope decision -> backend=$backend frontend=$frontend (documentation-only files: $docs)"

  publish-backend:
    name: Publish nereidforge-backend dev image
    needs: path-scope
    if: needs.path-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        name: Derive image build metadata
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture backend index
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            VERSION=0.0.0-dev
          push: true
          provenance: false
          sbom: false
          # Share the release applications cache scope (treaty §19.1).
          # Publication is self-sufficient; no separate cache-warm run is required.
          cache-from: type=gha,scope=nereidforge-backend
          cache-to: type=gha,mode=max,scope=nereidforge-backend
          tags: |
            ghcr.io/nereidai/nereidforge-backend:0.0.0-dev-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/nereidforge-backend:0.0.0-dev

  publish-frontend:
    name: Publish nereidforge-frontend dev image
    needs: path-scope
    if: needs.path-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        name: Derive image build metadata
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture frontend index
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.0.0-dev
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            VITE_APP_VERSION=0.0.0-dev
            VITE_IMAGE_TAG=0.0.0-dev
          push: true
          provenance: false
          sbom: false
          # Share the release applications cache scope (treaty §19.1).
          # Publication is self-sufficient; no separate cache-warm run is required.
          cache-from: type=gha,scope=nereidforge-frontend
          cache-to: type=gha,mode=max,scope=nereidforge-frontend
          tags: |
            ghcr.io/nereidai/nereidforge-frontend:0.0.0-dev-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/nereidforge-frontend:0.0.0-dev
