# Build and publish NereidForge production images, nine active Helm charts, and
# the repository-shaped source/installer archive. Images and charts use GHCR;
# the installer and chart/image manifests are attached to the GitHub Release.
# The legacy Kubeflow Helm umbrella is not an active installer and is excluded.
#
# Publication model (root treaty §19):
# - Triggered ONLY by pushing a new git tag matching v*; there is no manual
#   dispatch and no branch/PR publication. A fail-fast step validates the tag
#   against v-prefixed SemVer and derives the bare version (v0.0.1 -> 0.0.1);
#   there is no VERSION file, so tag protection rules are the compensating
#   control (treaty §19.5).
# - Every image is published by docker/build-push-action@v6 with the standard
#   qemu + buildx + login action chain and exactly three tags: VERSION,
#   VERSION-<utc-timestamp> and VERSION-<git-short-sha>. No floating tag is
#   ever produced (the notebook workbench keeps py3.12 as its version
#   component, with the same three-tag shape).
# - Generic product images are linux/amd64 + linux/arm64 indexes. The
#   hardware-bound CUDA/ROCm/Intel-XPU images are the sole single-arch
#   (linux/amd64) exceptions alongside the dependency-bound images below.
# - Chart jobs start only after every image job succeeds. Product charts inject
#   the bare release version into version/appVersion; third-party wrappers keep
#   their pinned Chart.yaml metadata. Packaged charts are rendered and checked
#   for development-image leaks before their authenticated pull verification.
# - The installer job runs only after all nine chart publications succeed. Its
#   archive carries generated release.env metadata, so installation without a
#   .git directory cannot silently select 0.0.0-dev. The custom installer is the
#   sole supported Release installation archive; raw Source code archives fail
#   closed. Existing published Releases are never modified and assets are never
#   clobbered; a draft is published only after all four assets upload.
# - The local Makefile stays an independent build-only interface and is never
#   called by this workflow. Local/air-gapped hub copies are the operator's
#   own decision, performed with NereidOverview harbor-sync.sh.
# The image jobs stay inline instead of calling the organization reusable workflow
# because NF needs specialized wheel-index variables and (for the applications)
# per-architecture rootfs/runtime verification that the reusable call cannot
# express; the action chain and tag scheme are otherwise identical.
name: publish-images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Never cancel a run during publication. The run ID prevents two deliberate
# rebuilds of the mutable VERSION tag from blocking one another.
concurrency:
  group: publish-images-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  TORCH_CPU_INDEX: ${{ vars.TORCH_CPU_INDEX }}
  TORCH_XPU_INDEX: ${{ vars.TORCH_XPU_INDEX }}
  TORCH_ROCM_INDEX: ${{ vars.TORCH_ROCM_INDEX }}
  PADDLE_GPU_INDEX: ${{ vars.PADDLE_GPU_INDEX }}
  HF_ENDPOINT: ${{ vars.HF_ENDPOINT }}

jobs:
  applications:
    name: backend/frontend AMD64+ARM64 indexes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # build-args list bare ARG names on purpose: the validated bare version
        # is only known after the 'ver' step, which the matrix cannot reference,
        # so the build step exports those names in its env and buildx reads the
        # values from there (--build-arg NAME with no value uses the environment).
        include:
          - component: backend
            context: .
            file: python-backend/Dockerfile
            build-args: |
              VERSION
          - component: frontend
            context: frontend
            file: frontend/Dockerfile
            build-args: |
              VERSION
              VITE_APP_VERSION
              VITE_IMAGE_TAG
    steps:
      - uses: actions/checkout@v7
      - id: ver
        name: Validate tag and derive bare version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::tag $tag is not v-prefixed SemVer without build metadata"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            IFS='.' read -ra prerelease_identifiers <<< "${tag#*-}"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "${#identifier}" -gt 1 && "$identifier" == 0* ]]; then
                echo "::error::numeric SemVer pre-release identifiers must not contain leading zeroes"
                exit 1
              fi
            done
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - id: stamp
        name: Derive traceability tags
        run: |
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture application index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_IMAGE_TAG: ${{ steps.ver.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ matrix.build-args }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=nereidforge-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=nereidforge-${{ matrix.component }}
          tags: |
            ghcr.io/nereidai/nereidforge-${{ matrix.component }}:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/nereidforge-${{ matrix.component }}:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/nereidforge-${{ matrix.component }}:${{ steps.ver.outputs.version }}
      - name: Verify per-platform rootfs and runtime
        shell: bash
        run: |
          set -euo pipefail
          component="${{ matrix.component }}"
          version="${{ steps.ver.outputs.version }}"

          # platform_digest returns the exact child manifest for one required
          # architecture, rejecting an AMD64-only or otherwise incomplete index.
          platform_digest() {
            local index_file="$1" architecture="$2"
            python3 - "$index_file" "$architecture" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as stream:
              index = json.load(stream)
          matches = [
              item["digest"]
              for item in index.get("manifests", [])
              if item.get("platform", {}).get("os") == "linux"
              and item["platform"].get("architecture") == sys.argv[2]
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one linux/{sys.argv[2]} manifest, found {matches}")
          print(matches[0])
          PY
          }

          repository="ghcr.io/nereidai/nereidforge-${component}"
          image="${repository}:${version}"
          docker buildx imagetools inspect --raw "$image" > "/tmp/${component}-index.json"
          for architecture in amd64 arm64; do
            digest="$(platform_digest "/tmp/${component}-index.json" "$architecture")"
            platform_image="${repository}@${digest}"
            docker pull --platform "linux/${architecture}" "$platform_image"
            docker image inspect "$platform_image" > "/tmp/${component}-${architecture}.json"
          done
          python3 - "$component" <<'PY'
          import json
          import sys

          component = sys.argv[1]
          images = {}
          for architecture, expected in (("amd64", "amd64"), ("arm64", "arm64")):
              with open(f"/tmp/{component}-{architecture}.json") as stream:
                  image = json.load(stream)[0]
              assert image["Architecture"] == expected, (component, image["Architecture"])
              layers = image.get("RootFS", {}).get("Layers", [])
              assert layers, (component, architecture, "empty rootfs")
              images[architecture] = layers
          assert images["amd64"] != images["arm64"], (component, "identical rootfs layers")
          print(component, "distinct AMD64/ARM64 rootfs layers verified")
          PY
          for architecture in amd64 arm64; do
            digest="$(platform_digest "/tmp/${component}-index.json" "$architecture")"
            platform_image="${repository}@${digest}"
            case "$architecture" in
              amd64) expected_machine="x86_64" ;;
              arm64) expected_machine="aarch64" ;;
            esac
            if [[ "$component" == "backend" ]]; then
              docker run --rm --network none --platform "linux/${architecture}" \
                --env EXPECTED_MACHINE="$expected_machine" \
                --entrypoint python "$platform_image" -c \
                'import os, platform, sys; from app.services.model_format import detect_family; assert platform.machine() == os.environ["EXPECTED_MACHINE"]; assert sys.version_info[:2] == (3, 14); assert detect_family(None, "bucket", "model.pt", declared="torch") == "torch"; print(platform.machine(), sys.version)'
            else
              docker run --rm --network none --platform "linux/${architecture}" \
                --env EXPECTED_MACHINE="$expected_machine" \
                --entrypoint /bin/sh "$platform_image" -c \
                'test "$(uname -m)" = "$EXPECTED_MACHINE" && nginx -v'
            fi
          done

  core:
    name: core runtime, converters, optimizer, and evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: ver
        name: Validate tag and derive bare version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::tag $tag is not v-prefixed SemVer without build metadata"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            IFS='.' read -ra prerelease_identifiers <<< "${tag#*-}"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "${#identifier}" -gt 1 && "$identifier" == 0* ]]; then
                echo "::error::numeric SemVer pre-release identifiers must not contain leading zeroes"
                exit 1
              fi
            done
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - id: stamp
        name: Derive traceability tags
        run: |
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish runtime base
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            VERSION=${{ steps.ver.outputs.version }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=nf-runtime
          cache-to: type=gha,mode=max,scope=nf-runtime
          tags: |
            ghcr.io/nereidai/nf-runtime:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/nf-runtime:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/nf-runtime:${{ steps.ver.outputs.version }}
      - name: Build and publish CPU torch trainer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-torch/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=trainer-torch-cpu
          cache-to: type=gha,mode=max,scope=trainer-torch-cpu
          tags: |
            ghcr.io/nereidai/trainer-torch-cpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/trainer-torch-cpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/trainer-torch-cpu:${{ steps.ver.outputs.version }}
      - name: Build and publish CPU paddle trainer (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/trainer-paddle/Dockerfile
          # paddlepaddle 3.0.0 publishes no arm64 PyPI wheel; keep this image amd64-only.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=trainer-paddle-cpu
          cache-to: type=gha,mode=max,scope=trainer-paddle-cpu
          tags: |
            ghcr.io/nereidai/trainer-paddle-cpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/trainer-paddle-cpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/trainer-paddle-cpu:${{ steps.ver.outputs.version }}
      - name: Build and publish torch converter
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            PYTHON_BASE_IMAGE=python:3.14-slim
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=trainer-convert
          cache-to: type=gha,mode=max,scope=trainer-convert
          tags: |
            ghcr.io/nereidai/trainer-convert:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/trainer-convert:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/trainer-convert:${{ steps.ver.outputs.version }}
      - name: Build and publish TensorFlow converter
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert-tf
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=trainer-convert-tf
          cache-to: type=gha,mode=max,scope=trainer-convert-tf
          tags: |
            ghcr.io/nereidai/trainer-convert-tf:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/trainer-convert-tf:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/trainer-convert-tf:${{ steps.ver.outputs.version }}
      - name: Build and publish Paddle converter (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: kfp-pipelines/docker
          file: kfp-pipelines/docker/Dockerfile.convert-pp
          # Pins paddlepaddle==3.0.0, which has no arm64 PyPI wheel; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            PYTHON_BASE_IMAGE=python:3.11-slim
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=trainer-convert-pp
          cache-to: type=gha,mode=max,scope=trainer-convert-pp
          tags: |
            ghcr.io/nereidai/trainer-convert-pp:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/trainer-convert-pp:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/trainer-convert-pp:${{ steps.ver.outputs.version }}
      - name: Build and publish optimizer
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/optimizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            VERSION=${{ steps.ver.outputs.version }}
            RUNTIME_IMAGE=ghcr.io/nereidai/nf-runtime:${{ steps.ver.outputs.version }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=train-optimizer
          cache-to: type=gha,mode=max,scope=train-optimizer
          tags: |
            ghcr.io/nereidai/train-optimizer:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/train-optimizer:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/train-optimizer:${{ steps.ver.outputs.version }}
      - name: Build and publish evaluator
        uses: docker/build-push-action@v6
        with:
          context: builders
          file: builders/evaluator/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            VERSION=${{ steps.ver.outputs.version }}
            RUNTIME_IMAGE=ghcr.io/nereidai/nf-runtime:${{ steps.ver.outputs.version }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=train-evaluator
          cache-to: type=gha,mode=max,scope=train-evaluator
          tags: |
            ghcr.io/nereidai/train-evaluator:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/train-evaluator:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/train-evaluator:${{ steps.ver.outputs.version }}
      - name: Build and publish Intel GPU OVMS (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/inference-model-server-openvino-xpu
          file: builders/inference-model-server-openvino-xpu/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            BASE_IMAGE=openvino/model_server:2025.1
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=inference-model-server-openvino-xpu
          cache-to: type=gha,mode=max,scope=inference-model-server-openvino-xpu
          tags: |
            ghcr.io/nereidai/inference-model-server-openvino-xpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/inference-model-server-openvino-xpu:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/inference-model-server-openvino-xpu:${{ steps.ver.outputs.version }}
      - name: Build and publish ml-backend (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/ml-backend
          file: builders/ml-backend/Dockerfile
          # Installs paddlepaddle/paddleocr, unavailable as arm64 PyPI wheels; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
          # small for the CUDA/ROCm vendor jobs, switch those to
          # type=registry against a dedicated GHCR cache repository.
          cache-from: type=gha,scope=ml-backend
          cache-to: type=gha,mode=max,scope=ml-backend
          tags: |
            ghcr.io/nereidai/ml-backend:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.sha }}
            ghcr.io/nereidai/ml-backend:${{ steps.ver.outputs.version }}-${{ steps.stamp.outputs.ts }}
            ghcr.io/nereidai/ml-backend:${{ steps.ver.outputs.version }}
      - name: Build and publish ml-backend-custom (single-arch exception, treaty §19.2.1)
        uses: docker/build-push-action@v6
        with:
          context: builders/ml-backend-custom
          file: builders/ml-backend-custom/Dockerfile
          # Installs paddlepaddle/paddleocr, unavailable as arm64 PyPI wheels; keep amd64-only.
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
            TORCH_CPU_INDEX=${{ env.TORCH_CPU_INDEX }}
          push: true
          provenance: false
          sbom: false
          # Shared GHA layer cache across CI and release runs; a cold cache
          # falls back to a full build. If the 10 GB GHA quota proves too
