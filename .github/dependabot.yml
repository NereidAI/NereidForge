# Weekly dependency update proposals for the backend, frontend, workflows, and
# container build definitions. Review license and runtime compatibility before
# merging any update.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app/python-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
