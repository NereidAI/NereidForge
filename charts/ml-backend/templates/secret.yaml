{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.lsTokenKey }}: {{ .Values.lsToken | default "" | quote }}
{{- end }}
