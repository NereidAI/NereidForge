{{- /*
Replicate the CNPG bootstrap credentials into the tenant namespace so the backend
pods' secretKeyRef (postgresql.existingSecret) resolves. Sourced from the
system-namespace bootstrap secret via lookup; previously created imperatively in
backend.sh. Rendered empty when the source secret is absent (offline template).
*/ -}}
{{- $pg := lookup "v1" "Secret" "nereidforge" "pg-nereidforge-postgresql-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: pg-nereidforge-credentials
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: nereidforge
  password: {{ if $pg }}{{ index $pg.data "password" | b64dec }}{{ else }}""{{ end }}
