# API Deployment for the NereidForge backend chart.
{{- if and .Values.enabled .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nereidforge-backend.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge-backend.labels" . | nindent 4 }}
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "nereidforge-backend.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      annotations:
        {{- if .Values.api.podAnnotations }}
        {{- toYaml .Values.api.podAnnotations | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/pg-credentials: {{ include (print $.Template.BasePath "/pg-credentials.yaml") . | sha256sum }}
        checksum/s3-credentials: {{ (lookup "v1" "Secret" .Release.Namespace (required "s3.existingSecret is required" .Values.s3.existingSecret)).data | toJson | sha256sum }}
      labels:
        {{- include "nereidforge-backend.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nereidforge-backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --workers
            - "2"
            # --loop asyncio is REQUIRED: the model-registry SDK 0.3.14 calls
            # nest_asyncio2.apply() (="Can't patch loop of type uvloop.Loop")
            # on init, which breaks under uvicorn's default uvloop event loop
            # and makes hub.enabled()=False (manual model/uploads never reach
            # Kubeflow Hub). Worker uses plain asyncio so it is unaffected.
            - --loop
            - asyncio
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            {{- toYaml .Values.api.env | nindent 12 }}
            {{- if .Values.postgresql.existingSecret }}
            - name: NEREIDFORGE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.existingSecretKey | default "password" }}
                  optional: false
            {{- end }}
            - name: NEREIDFORGE_KFP_OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyKey | default "accessKey" }}
                  optional: false
            - name: NEREIDFORGE_KFP_OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeyKey | default "secretKey" }}
                  optional: false
            - name: NEREIDFORGE_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyKey | default "accessKey" }}
                  optional: false
            - name: NEREIDFORGE_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeyKey | default "secretKey" }}
                  optional: false
            {{- if .Values.caBundleSecret }}
            # Trust the in-cluster internal CA for outbound TLS to SSO/NS.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/nereid-internal-ca.crt
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "nereidforge-backend.fullname" . }}-secrets
          volumeMounts:
            {{- if .Values.caBundleSecret }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/nereid-internal-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.caBundleSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caBundleSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nereidforge-backend.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge-backend.labels" . | nindent 4 }}
    component: api
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  {{- if .Values.api.ingress.tls }}
  tls:
    {{- toYaml .Values.api.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- toYaml .Values.api.ingress.hosts | nindent 4 }}
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nereidforge-backend.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge-backend.labels" . | nindent 4 }}
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nereidforge-backend.api.fullname" . }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
{{- end }}
