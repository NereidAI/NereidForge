{{- if .Values.enabled }}
{{- /*
Tracked runtime configuration uses the rolling-dev placeholder for suite-owned
images. Rewrite exact inline references and adjacent repository/tag fields to
the package appVersion so OCI releases cannot retain development references in
embedded YAML.
*/}}
{{- $suiteImagePattern := `(ghcr\.io/nereidai/[A-Za-z0-9][A-Za-z0-9._/-]*):0\.0\.0-dev` -}}
{{- $suiteImageReplacement := printf "${1}:%s" .Chart.AppVersion -}}
{{- $suiteImageFieldPattern := `(?m)(repository:[^\n]*ghcr\.io/nereidai/[A-Za-z0-9][A-Za-z0-9._/-]*[^\n]*\n[ \t]*tag:[ \t]*["']?)0\.0\.0-dev` -}}
{{- $suiteImageFieldReplacement := printf "${1}%s" .Chart.AppVersion -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nereidforge-backend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge-backend.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $baseConfig := .Files.Get "config.rendered.yaml" }}
    {{- $baseConfig = regexReplaceAll $suiteImagePattern $baseConfig $suiteImageReplacement }}
    {{- regexReplaceAll $suiteImageFieldPattern $baseConfig $suiteImageFieldReplacement | nindent 4 }}
    {{- $overrideConfig := .Values.config | default dict | toYaml }}
    {{- $overrideConfig = regexReplaceAll $suiteImagePattern $overrideConfig $suiteImageReplacement }}
    {{- regexReplaceAll $suiteImageFieldPattern $overrideConfig $suiteImageFieldReplacement | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nereidforge-backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $secrets := .Values.secrets }}
  {{- if and $secrets.database.password }}
  NEREIDFORGE_DATABASE_PASSWORD: {{ $secrets.database.password | quote }}
  {{- end }}
  {{- if and $secrets.sso $secrets.sso.ns.client_secret }}
  NEREIDFORGE_SSO_NS_CLIENT_SECRET: {{ $secrets.sso.ns.client_secret | quote }}
  {{- end }}
  {{- if and $secrets.sso $secrets.sso.oidc.client_secret }}
  NEREIDFORGE_SSO_OIDC_CLIENT_SECRET: {{ $secrets.sso.oidc.client_secret | quote }}
  {{- end }}
  {{- if $secrets.auth.jwt_secret }}
  NEREIDFORGE_AUTH_JWT_SECRET: {{ $secrets.auth.jwt_secret | quote }}
  {{- end }}
  {{- if $secrets.kfp.object_store_access_key }}
  NEREIDFORGE_KFP_OBJECT_STORE_ACCESS_KEY: {{ $secrets.kfp.object_store_access_key | quote }}
  {{- end }}
  {{- if $secrets.kfp.object_store_secret_key }}
  NEREIDFORGE_KFP_OBJECT_STORE_SECRET_KEY: {{ $secrets.kfp.object_store_secret_key | quote }}
  {{- end }}
  {{- if $secrets.labelstudio.token }}
  NEREIDFORGE_LABELSTUDIO_TOKEN: {{ $secrets.labelstudio.token | quote }}
  {{- end }}
  {{- if $secrets.cvat.token }}
  NEREIDFORGE_CVAT_TOKEN: {{ $secrets.cvat.token | quote }}
  {{- end }}
  {{- if $secrets.storage.s3_access_key }}
  NEREIDFORGE_STORAGE_S3_ACCESS_KEY: {{ $secrets.storage.s3_access_key | quote }}
  {{- end }}
  {{- if $secrets.storage.s3_secret_key }}
  NEREIDFORGE_STORAGE_S3_SECRET_KEY: {{ $secrets.storage.s3_secret_key | quote }}
  {{- end }}
{{- end }}