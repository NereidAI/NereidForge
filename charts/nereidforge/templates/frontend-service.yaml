{{- if and .Values.enabled .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nereidforge.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "nereidforge.selectorLabels" . | nindent 4 }}
    component: frontend
{{- end }}
