apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nereidforge.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}