# Worker Deployment for the consolidated NereidForge chart.
{{- if and .Values.enabled .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nereidforge.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nereidforge.labels" . | nindent 4 }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "nereidforge.selectorLabels" . | nindent 6 }}
      component: worker
  template:
    metadata:
      annotations:
        {{- if .Values.worker.podAnnotations }}
        {{- toYaml .Values.worker.podAnnotations | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/pg-credentials: {{ include (print $.Template.BasePath "/pg-credentials.yaml") . | sha256sum }}
        checksum/s3-credentials: {{ (lookup "v1" "Secret" .Release.Namespace (required "s3.existingSecret is required" .Values.s3.existingSecret)).data | toJson | sha256sum }}
      labels:
        {{- include "nereidforge.selectorLabels" . | nindent 8 }}
        component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nereidforge.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - app.worker
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            {{- toYaml .Values.worker.env | nindent 12 }}
            {{- if .Values.caBundleSecret }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/nereid-internal-ca.crt
            {{- end }}
            {{- if .Values.postgresql.existingSecret }}
            - name: NEREIDFORGE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.existingSecretKey | default "password" }}
                  optional: false
            {{- end }}
            - name: NEREIDFORGE_KFP_OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyKey | default "accessKey" }}
                  optional: false
            - name: NEREIDFORGE_KFP_OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeyKey | default "secretKey" }}
                  optional: false
            - name: NEREIDFORGE_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyKey | default "accessKey" }}
                  optional: false
            - name: NEREIDFORGE_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeyKey | default "secretKey" }}
                  optional: false
          envFrom:
            - secretRef:
                name: {{ include "nereidforge.runtimeSecretName" . }}
          volumeMounts:
            - name: config
              mountPath: /etc/nereidforge/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.caBundleSecret }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/nereid-internal-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "nereidforge.fullname" . }}-config
        {{- if .Values.caBundleSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caBundleSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
