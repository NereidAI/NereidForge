{{- /*
Replicate the CNPG bootstrap credentials into the tenant namespace so the API
and worker pods' secretKeyRef (postgresql.existingSecret) resolves. Sourced from
the system-namespace bootstrap secret via lookup; historically created
imperatively by the deploy script. Rendered empty when the source secret is
absent (offline template).
*/ -}}
{{- if .Values.postgresql.createSecret }}
{{- $pg := lookup "v1" "Secret" "nereidforge" "pg-nereidforge-postgresql-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: pg-nereidforge-credentials
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: nereidforge
  password: {{ if $pg }}{{ index $pg.data "password" | b64dec }}{{ else }}""{{ end }}
{{- end }}
