# NereidForge Unified Configuration
# Single source of truth for all environments
# Render with: jinja2 config.yaml.j2 -D env=prod -D db_password=xxx -D jwt_secret=xxx ...
# All durations as integers (seconds) unless explicitly noted

# =============================================================================
# Environment & Global
# =============================================================================
env: "prod"                    # dev | prod
domain: ""               # e.g. forge.example.com
wildcard_domain: ""

# =============================================================================
# Server
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

# =============================================================================
# Suite SSO / Auth  (NereidIdentity docs/sso-integration-standard.md v2)
# mode: local (break-glass) | ns (NS ticket) | oidc (direct RP)
# =============================================================================
sso:
  mode: "ns"
  jit_tenant: "default"
  ns:
    base_url: ""  # required for prod renders in ns mode
    product_id: "forge"
    client_secret: ""  # set via NEREIDFORGE_SSO_NS_CLIENT_SECRET (ns mode only)
    callback_path: "/auth/ns-callback"
    reconcile_memberships: true
  oidc:
    client_secret: ""  # set via NEREIDFORGE_SSO_OIDC_CLIENT_SECRET (oidc mode only)

    issuer: ""  # required in prod oidc mode via NEREIDFORGE_SSO_OIDC_ISSUER
    client_id: "nereidforge"
    redirect_url: ""
    frontend_base_url: ""

    scopes: ["openid", "profile", "email", "roles"]
    roles_claim: "realm_access.roles"
    role_map:
      admin: ["admin", "user"]
      operator: ["admin", "user"]
      user: ["user"]
    default_roles: ["user"]
    reject_unknown_roles: false
    state_ttl: 600
    frontchannel_logout: true

auth:
  enabled: true
  jwt_secret: ""  # injected at deploy time
  issuer: "nereidforge"
  access_ttl: 43200       # 12h
  refresh_ttl: 604800     # 168h

# =============================================================================
# Database
# =============================================================================
database:

  host: "nereidforge-postgresql-rw.nereidforge.svc.cluster.local"

  name: "nereidforge"


  port: 5432
  user: "nereidforge"
  password: ""  # injected at deploy time
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

# =============================================================================
# KFP (Kubeflow Pipelines)
# =============================================================================
kfp:

  host: "http://ml-pipeline.kubeflow:8888"
  object_store_endpoint: "http://seaweedfs-s3.nereidforge:9000"

  namespace: "kubeflow"
  service_account: "pipeline-runner"
  timeout: 300
  poll_interval: 10
  object_store_access_key: ""
  object_store_secret_key: ""
  object_store_bucket: "mlpipeline"
  object_store_namespace: "nereidforge"

# =============================================================================
# Model Registry (Kubeflow Hub)
# =============================================================================
hub:

  host: "http://model-registry-service.default:8080"

  timeout: 30

# =============================================================================
# Trainer
# =============================================================================
trainer:

  host: "http://nereidforge-trainer.nereidforge:8890"

  timeout: 30

# =============================================================================
# Label Studio
# =============================================================================
labelstudio:

  host: "http://labelstudio.nereidforge.svc.cluster.local:8080"
  ml_backend_url: "http://ml-backend.nereidforge:9090"

  ml_backend_cluster_url: "http://ml-backend.nereidforge:9090"
  token: ""  # injected via NEREIDFORGE_LABELSTUDIO_TOKEN

  public_host: ""

  timeout: 30

# =============================================================================
# CVAT
# =============================================================================
cvat:

  host: "http://cvat-backend-service.nereidforge.svc.cluster.local:8080"

  token: ""  # injected via NEREIDFORGE_CVAT_TOKEN

  public_host: ""

  timeout: 30

# =============================================================================
# Storage (SeaweedFS)
# =============================================================================
storage:
  backend: "seaweedfs"
  bucket: "nereidforge"
  # Per-request dataset upload limits; NEREIDFORGE_STORAGE_UPLOAD_MAX_* overrides them.
  upload_max_files: 200
  upload_max_bytes: 1073741824

  endpoint: "http://seaweedfs-filer.nereidforge.svc.cluster.local:8888"
  s3_endpoint: "http://seaweedfs-s3.nereidforge.svc.cluster.local:8333"

  s3_access_key: ""
  s3_secret_key: ""
  s3_cluster_endpoint: "http://seaweedfs-s3.nereidforge.svc.cluster.local:8333"
  filer_cluster_endpoint: "http://seaweedfs-filer.nereidforge.svc.cluster.local:8888"

# =============================================================================
# Serving (KServe)
# =============================================================================
serving:
  namespace: "nereidforge"
  download_url_base: "http://seaweedfs-s3.nereidforge.svc.cluster.local:8333"
  runtime_images:
    openvino: "openvino/model_server:latest"
    openvino_xpu: "ghcr.io/nereidai/inference-model-server-openvino-xpu:0.0.0-dev"
    triton: "nvcr.io/nvidia/tritonserver:26.01-py3"
    torch: "pytorch/pytorch:2.1.2-cuda12.1-cudnn8-runtime"
    huggingface: "ghcr.io/huggingface/text-generation-inference:latest"
  triton_config_pbtxt: |
    name: "model"
    platform: "onnxruntime_onnx"
    max_batch_size: 0
    default_model_filename: "model.onnx"
  serving_port: 8080
  ingress_class: "traefik"
  domain_suffix: "inference"
  platform_domain: ""

# =============================================================================
# Worker
# =============================================================================
worker:
  enabled: true
  poll_interval: 3
  concurrency: 5
  kfp_completion_ttl: 86400
  event_publish_retry: 5

# =============================================================================
# OIDC (shared with auth section above)
# =============================================================================
# oidc section already defined above

# =============================================================================
# Event
# =============================================================================
event:
  webhook:
    enabled: false
  kafka:
    enabled: false

# =============================================================================
# Logging & Tracing
# =============================================================================
logging:
  level: "info"
  format: "json"

tracing:
  enabled: false

# =============================================================================
# CVAT (values for Helm chart)
# =============================================================================
cvat:

  host: "http://cvat-backend-service.nereidforge.svc.cluster.local:8080"

  token: ""  # injected via NEREIDFORGE_CVAT_TOKEN

  public_host: ""

  timeout: 30

# =============================================================================
# Trainer (Helm chart values)
# =============================================================================
trainer_helm:

  host: "http://nereidforge-trainer.nereidforge:8890"

  timeout: 30

# =============================================================================
# Label Studio Helm values
# =============================================================================
labelstudio_helm:

  host: "http://labelstudio.nereidforge.svc.cluster.local:8080"
  public_host: ""

  ml_backend_url: "http://ml-backend.nereidforge:9090"
  ml_backend_cluster_url: "http://ml-backend.nereidforge:9090"
  timeout: 30

# =============================================================================
# CVAT Helm values
# =============================================================================
cvat_helm:

  host: "http://cvat-backend-service.nereidforge.svc.cluster.local:8080"
  public_host: ""

  timeout: 30

# =============================================================================
# ML Backend Helm values
# =============================================================================
ml_backend_helm:
  image:
    repository: "ghcr.io/nereidai/ml-backend"
    tag: "0.0.0-dev"
  service:
    port: 9090
    targetPort: 9090
  imagePullSecrets: []
  serviceAccount:
    create: false
  podAnnotations: {}
  securityContext:
    capabilities:
      drop: ["ALL"]
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
    name: http
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  readinessProbe:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: 9090
    initialDelaySeconds: 120
    periodSeconds: 20
    timeoutSeconds: 5
  secret:
    name: ml-backend-ls-token
    lsTokenKey: token
  lsToken: ""
  backend:
    labelStudioHost: "http://labelstudio.nereidforge.svc.cluster.local:8080"
    modelRoot: /app/models
    modelPath: ""
    modelScoreThreshold: "0.5"
    allowCustomModelPath: "true"
    workers: "1"
    threads: "4"
    defaultConfidence: "0.6"
  s3:
    endpoint: "http://seaweedfs-s3.nereidforge.svc.cluster.local:8333"
    existingSecret: "seaweedfs-s3-credentials"
    accessKeyKey: "accessKey"
    secretKeyKey: "secretKey"
  external:
    tritonUrl: "http://triton.nereidforge.svc:8000"
    vllmUrl: "http://vllm.nereidforge.svc:8000"
    modelRegistryUrl: "http://model-registry.kubeflow.svc:8080"
  volumeMounts: []
  volumes: []

# =============================================================================
# Backend Helm values
# =============================================================================
backend_helm:
  enabled: true
  replicas: 2
  image:
    repository: "ghcr.io/nereidai/nereidforge-backend"
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "internal-ca"
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nereidforge-api-tls
        hosts:
          - ""
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Frontend Helm values
# =============================================================================
frontend_helm:
  image:
    repository: "ghcr.io/nereidai/nereidforge-frontend"
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "internal-ca"
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nereidforge-frontend-tls
        hosts:
          - ""

# =============================================================================
# ML Backend Helm values (already defined above as ml_backend_helm)
# =============================================================================

# =============================================================================
# PostgreSQL (CNPG) - cluster config
# =============================================================================
postgresql:
  clusterName: "nereidforge-postgresql"
  instances: 3
  storageSize: "50Gi"
  superuserSecret: "pg-nereidforge-credentials"

# =============================================================================
# Valkey (external cache for Label Studio / CVAT; NF backend does not use it)
# =============================================================================
valkey_helm:
  masterStorage: "10Gi"
  replicaStorage: "10Gi"
  replicaCount: 2

# =============================================================================
# SeaweedFS
# =============================================================================
seaweedfs_helm:
  masterStorage: "10Gi"
  volumeStorage: "200Gi"

# =============================================================================
# Label Studio Helm
# =============================================================================
labelstudio_helm_values:
  storage: "20Gi"

# =============================================================================
# CVAT Helm
# =============================================================================
cvat_helm_values:
  storage: "50Gi"

# =============================================================================
# Secrets (injected at deploy time via env vars)
# =============================================================================
secrets:
  database:
    password: ""
  sso:
    ns:
      client_secret: ""
    oidc:
      client_secret: ""
  auth:
    jwt_secret: ""
  labelstudio:
    token: ""  # injected
  cvat:
    token: ""  # injected
  serving:
    pass: ""

# =============================================================================
# Registry
# =============================================================================
registry:
  host: ""
  user: ""
  password: ""

# =============================================================================
# NFS
# =============================================================================
nfs:
  server: ""  # required operator input when NFS storage is enabled
  share: ""   # required operator input when NFS storage is enabled
  storageClass: "nfs-csi"

# =============================================================================
# Cert Manager / Let's Encrypt
# =============================================================================
certmanager:
  letsencryptEmail: ""  # required only for a Let's Encrypt issuer
  clusterIssuer: "internal-ca"

# =============================================================================
# Pod CIDR
# =============================================================================
podCidr: "10.42.0.0/16"