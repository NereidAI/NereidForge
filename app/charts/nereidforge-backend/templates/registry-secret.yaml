{{- /*
Optional private-registry pull secret for the tenant namespace. Rendered only
when registry.host, registry.username and registry.password are all supplied
through the operator's untracked -f file; incomplete credentials render no
broken authentication entry. The normal air-gap path is the node-level
containerd mirror (root treaty §18), which needs no pod pull secret at all.
*/ -}}
{{- if and .Values.registry.host .Values.registry.username .Values.registry.password }}
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.registry.host .Values.registry.username .Values.registry.password .Values.registry.email (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc) | quote }}
{{- end }}
