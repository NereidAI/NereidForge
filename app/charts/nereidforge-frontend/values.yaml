# NereidForge Frontend Helm Chart Values

# This release does NOT own the tenant namespace; the backend release creates
# it. Frontend renders resources into the shared namespace without a Namespace
# object so Helm ownership metadata does not conflict.
namespace:
  create: false

# Global settings (shared with backend). Self-built images always use public
# ghcr.io/nereidai flat coordinates (root treaty §18); the chart carries no
# registry switch — air-gapped pulls use the node containerd mirror.
global:
  # Required site-specific base domain; no customer domain is tracked here.
  domain: ""
  storageClass: nfs-csi
  tls:
    enabled: true
    clusterIssuer: internal-ca

replicaCount: 2

image:
  repository: ghcr.io/nereidai/nereidforge-frontend
  # In-branch default is the rolling dev channel (root treaty §19.5); deploy
  # scripts override the tag with the tag-sourced bare release SemVer.
  pullPolicy: Always
  tag: "0.0.0-dev"

# Pull secret for private mirrors; empty for public GHCR images.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsUser: 101
  runAsGroup: 101
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "internal-ca"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  host: ""  # required; set with --set ingress.host=<public-hostname>
  paths:
    - path: /
      pathType: Prefix
      serviceName: nereidforge-frontend
      servicePort: 80
    - path: /api
      pathType: Prefix
      serviceName: nereidforge-api
      servicePort: 8080
    # NS suite console tenant picker; the API secret-authenticates it.
    - path: /v1/integration/ns
      pathType: Prefix
      serviceName: nereidforge-api
      servicePort: 8080
    # Bare-prefix Jupyter proxy (== notebook base_url), incl. websockets.
    - path: /notebook-servers
      pathType: Prefix
      serviceName: nereidforge-api
      servicePort: 8080
  tls:
    - secretName: nereidforge-frontend-tls
      hosts:
        - ""  # set to the same operator-supplied host as ingress.host

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  - name: NODE_ENV
    value: "production"
  # Deployment scripts derive both same-origin URLs from ingress.host.
  - name: NEXT_PUBLIC_API_URL
    value: ""
  - name: NEXT_PUBLIC_WS_URL
    value: ""

# Optional private-registry pull secret (templates/registry-secret.yaml).
# Rendered only when host, username and password are all supplied via the
# operator's untracked -f file; incomplete credentials render no secret.
registry:
  host: ""
  username: ""
  password: ""
  email: ""
