[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nereidforge-trainer"
description = "NereidForge trainer SDK: job env, S3 artifacts, manifests and capability profiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "YIQISOFT" }]
dynamic = ["version"]
dependencies = ["boto3>=1.34"]

[project.scripts]
nf-trainer = "nereidforge_trainer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nereidforge_trainer.__version__" }

[tool.setuptools.packages.find]
include = ["nereidforge_trainer*"]
