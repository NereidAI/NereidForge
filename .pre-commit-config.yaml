# Local git hooks. Install with: pre-commit install
# The same rules run in CI (.github/workflows/license-compliance.yml).
repos:
  - repo: local
    hooks:
      - id: license-compliance
        name: license compliance (LICENSE-POLICY.md)
        entry: bash scripts/check-license-compliance.sh --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
