# CVAT 2.73.0 official chart values (public deployment default).
# Decision (Q6): use the official chart with its built-in PG/cache/analytics/
# nuclio disabled, unified onto NereidForge CNPG / Valkey / SeaweedFS; images
# keep their public upstream coordinates and air-gapped nodes resolve them
# through the containerd registry mirror (root treaty section 18); ingress is
# signed by internal-ca. This file does not depend on BASE_DOMAIN
# (ingress.hostname is overridden by cvat.sh via --set).

# No pull secret for public upstream images (anonymous pull). An operator may
# supply registry credentials through an untracked override file if required.
imagePullSecrets: []

cvat:
  backend:
    image: cvat/server
    # Upstream tags carry a "v" prefix; keep it to match the public image tag.
    tag: "v2.73.0"
    numProxies: 1
    # Shared by server + all worker pods -> RWX; local-path only supports RWO.
    defaultStorage:
      enabled: true
      storageClassName: nfs-csi
      accessModes:
        - ReadWriteMany
      size: 20Gi
    server:
      envs:
        ALLOWED_HOSTS: "*"
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
      livenessProbe:
        enabled: true
        initialDelaySeconds: 60
    additionalEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: seaweedfs-s3-credentials
            key: accessKey
            optional: false
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: seaweedfs-s3-credentials
            key: secretKey
            optional: false
      - name: AWS_S3_ENDPOINT
        value: "http://seaweedfs-s3.nereidforge.svc.cluster.local:8333"
      - name: AWS_S3_BUCKET_NAME
        value: "cvat"
      - name: USE_SSL
        value: "false"
  frontend:
    image: cvat/ui
    tag: "v2.73.0"

  # OPA sidecar (pristine upstream image; node mirror resolves it offline)
  opa:
    image: openpolicyagent/opa
    tag: "1.12.2"
    imagePullPolicy: IfNotPresent

  # Disable built-in kvrocks and point ONDISK to external Valkey. Service port
  # 6666 targets the same instance's ondisk port and affects only large-object
  # caching; basic annotations use S3 and are unaffected.
  kvrocks:
    enabled: false
    external:
      host: valkey-master.nereidforge.svc.cluster.local

# External PostgreSQL (CNPG nereidforge, database=cvat).
postgresql:
  enabled: false
  external:
    host: nereidforge-postgresql-rw.nereidforge.svc.cluster.local
    port: 5432
  secret:
    create: false
    name: cvat-postgres-secret

# External cache: Valkey without a password.
# The values key `redis` is fixed by the official CVAT chart schema, as are the
# CVAT_REDIS_* environment variables in its templates; do not rename this key.
# The service referenced here is Valkey.
redis:
  enabled: false
  external:
    host: valkey-master.nereidforge.svc.cluster.local
  secret:
    create: false
    name: cvat-valkey-secret

# Smokescreen allow-list is configured below; no top-level opa key exists
# (the chart reads cvat.opa, set in the cvat: block above).

# Permit the official chart's non-Bitnami public image coordinates.
global:
  security:
    allowInsecureImages: true

# Components outside the MVP scope remain disabled.
nuclio:
  enabled: false
analytics:
  enabled: false
clickhouse:
  enabled: false

# The cluster already provides Traefik, so the chart must not deploy it.
traefik:
  enabled: false

ingress:
  enabled: true
  hostname: cvat.forge.example.com
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
  tls: true
  tlsSecretName: cvat-tls

# Smokescreen requires --allow-range with CIDRs; otherwise private S3 access is
# blocked and CVAT fails.
smokescreen:
  opts: "--allow-range=10.0.0.0/8 --allow-range=192.168.0.0/16 --allow-range=172.16.0.0/12"
