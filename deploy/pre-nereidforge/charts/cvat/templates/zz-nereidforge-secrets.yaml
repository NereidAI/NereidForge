{{- $pgCred := (lookup "v1" "Secret" .Release.Namespace "pg-nereidforge-postgresql-credentials") -}}
{{- $pgUsername := "nereidforge" -}}
{{- $pgPassword := "nereidforge" -}}
{{- if $pgCred -}}
  {{- $pgUsername = (index $pgCred.data "username") | b64dec -}}
  {{- $pgPassword = (index $pgCred.data "password") | b64dec -}}
{{- end -}}
{{- /* The upstream templates own these secrets whenever their defaults are enabled. */ -}}
{{- if not .Values.postgresql.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .Values.postgresql.secret.name . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cvat.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  database: {{ .Values.postgresql.auth.database | default "cvat" | quote }}
  username: {{ $pgUsername | quote }}
  password: {{ $pgPassword | quote }}
{{- end }}
{{- if not .Values.redis.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl (.Values.redis.secret.name) . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cvat.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: ""
{{- end }}
{{- if not (and .Values.cvat.kvrocks.enabled .Values.cvat.kvrocks.secret.create) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl (.Values.cvat.kvrocks.secret.name) . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cvat.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: ""
{{- end }}
