image: chrislusf/seaweedfs:4.34
imagePullPolicy: IfNotPresent
storageClass: nfs-csi

master:
  replicaCount: 1
  serviceIP: ""
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

volume:
  replicaCount: 1
  persistence:
    size: 200Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

filer:
  replicaCount: 1
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

s3:
  enabled: true
  replicaCount: 1
  accessKey: nereidforge
  secretKey: nereidforge
  # Prefixes anonymously readable without credentials. KServe predictor
  # containers download model artifacts over plain HTTP (no boto3/keys in the
  # serving images), so served ONNX models must be world-readable; scope it to
  # models/ + optimized/ only -- datasets (ds-*), base models and everything
  # else stay private. optimized/ holds OpenVINO IR (.xml/.bin) / TensorRT
  # artifacts produced by Model Optimization jobs that are themselves deployed
  # as served versions, so they share the models/ trust level.
  # A SeaweedFS "Read:<bucket>/<prefix>" identity action.
  anonymousReadPrefixes:
    - "Read:nereidforge/models/*"
    - "Read:nereidforge/optimized/*"
  resources:
    limits:
      cpu: "1"
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 256Mi

rack: "rack1"
dataCenter: "dc1"
