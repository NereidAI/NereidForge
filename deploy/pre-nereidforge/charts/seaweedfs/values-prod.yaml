image: chrislusf/seaweedfs:4.34
imagePullPolicy: IfNotPresent
storageClass: nfs-csi

master:
  replicaCount: 1
  serviceIP: "0.0.0.0"
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

volume:
  replicaCount: 2
  persistence:
    size: 100Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

filer:
  replicaCount: 2
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

s3:
  enabled: true
  replicaCount: 2
  existingSecret: seaweedfs-s3-credentials
  configKey: s3-config.json
  resources:
    limits:
      cpu: "1"
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 256Mi

rack: "rack1"
dataCenter: "dc1"