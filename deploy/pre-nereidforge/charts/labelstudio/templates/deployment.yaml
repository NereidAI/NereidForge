apiVersion: apps/v1
kind: Deployment
metadata:
  name: labelstudio
  namespace: {{ .Release.Namespace }}
  labels:
    app: labelstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labelstudio
  template:
    metadata:
      labels:
        app: labelstudio
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
      - name: labelstudio
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 8080
        env:
        - name: LABEL_STUDIO_HOST
          value: "{{ .Values.ingress.host }}"
        - name: LABEL_STUDIO_BASE_URL
          value: "https://{{ .Values.ingress.host }}"
        - name: LABEL_STUDIO_API_TOKEN
          value: "{{ .Values.token }}"
        - name: DATABASE_TYPE
          value: "postgres"
        - name: POSTGRES_HOST
          value: {{ .Values.postgresql.host }}
        - name: POSTGRES_PORT
          value: "{{ .Values.postgresql.port }}"
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.user }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: {{ .Values.postgresql.existingSecretKey }}
        # Label Studio reads the cache connection from REDIS_HOST/REDIS_PORT
        # env vars (upstream contract); the service itself is Valkey.
        - name: REDIS_HOST
          value: {{ .Values.valkey.host }}
        - name: REDIS_PORT
          value: "{{ .Values.valkey.port }}"
        - name: S3_ACCESS_KEY
          value: {{ .Values.s3.accessKey }}
        - name: S3_SECRET_KEY
          value: {{ .Values.s3.secretKey }}
        - name: S3_BUCKET
          value: {{ .Values.s3.bucket }}
        - name: S3_ENDPOINT
          value: {{ .Values.s3.endpoint }}
        - name: S3_USE_SSL
          value: "{{ .Values.s3.useSSL }}"
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
        - name: data
          mountPath: /label-studio/data
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: labelstudio-data
      securityContext:
        fsGroup: 0
