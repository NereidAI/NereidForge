cnpg:
  # Deploys the bundled CNPG operator subchart. Set false on shared clusters
  # that already run a cluster-wide cloudnative-pg operator (postgresql.sh
  # auto-detects and adopts the existing CRDs).
  enabled: true
  nameOverride: "cloudnative-pg"
  fullnameOverride: "cloudnative-pg"
  cluster:
    name: nereidforge
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4
    storage:
      size: 50Gi
      storageClass: nfs-csi
    bootstrap:
      initdb:
        database: nereidforge
        owner: nereidforge
        secret:
          name: pg-nereidforge-credentials
    postgresql:
      parameters:
        max_connections: "200"
        shared_buffers: "256MB"
        effective_cache_size: "1GB"
        work_mem: "16MB"
        maintenance_work_mem: "128MB"
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    tag: "1.30.0"
    pullPolicy: IfNotPresent
