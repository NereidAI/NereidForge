{{- /*
Bootstrap superuser secret for the CNPG Cluster. Previously created imperatively
via `kubectl create secret` in postgresql.sh; now rendered by the chart so the
whole PostgreSQL deployment is Helm-native. The password is supplied at deploy
time via --set bootstrap.password.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cnpg.cluster.bootstrap.initdb.secret.name }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cnpg.cluster.bootstrap.initdb.owner | quote }}
  password: {{ .Values.bootstrap.password | quote }}
